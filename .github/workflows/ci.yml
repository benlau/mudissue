name: Test and Build

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --logHeapUsage --no-cache --maxWorkers=1 --workerIdleMemoryLimit='500MB'

      - name: Build
        run: npm run build

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: mud-binary
          path: |
            package.json
            dist/index.js
            README.md
            docs/images
      - name: Publish
        if: github.event_name == 'workflow_dispatch'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
