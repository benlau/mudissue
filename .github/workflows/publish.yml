name: Publish

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: mudissue-deployment
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --logHeapUsage --no-cache --maxWorkers=1 --workerIdleMemoryLimit='500MB'

      - name: Build
        run: npm run build

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: mud-binary
          path: |
            package.json
            dist/index.js
            README.md
            docs/images
      - name: Publish
        run: npm publish --provenance --access public
